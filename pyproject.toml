[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venares-aulas"
version = "0.1.0"
description = "Automacao Zoom -> resumo em PDF -> Google Drive para as mentorias Venares"
requires-python = ">=3.11"

[project.scripts]
venares-aulas = "venares_aulas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
